<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finish Line Motorsports</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#0b0c10;
color:white;
margin:0;
}

.section{
padding:40px 20px;
max-width:1100px;
margin:auto;
}

h2{
margin-bottom:10px;
}

button{
cursor:pointer;
}

.btn{
background:#e22b2b;
color:white;
border:none;
padding:12px 16px;
border-radius:10px;
font-weight:bold;
}

.card{
background:#111;
border-radius:12px;
padding:15px;
}

.invGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:15px;
}

.invCard{
background:#111;
border-radius:12px;
overflow:hidden;
cursor:pointer;
}

.invCard img{
width:100%;
height:200px;
object-fit:cover;
}

.invBody{
padding:10px;
}

.modalBackdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.modalBackdrop.show{
display:flex;
}

.modal{
background:#111;
border-radius:12px;
max-width:900px;
width:95%;
overflow:hidden;
}

.modalContent{
display:grid;
grid-template-columns:1fr 1fr;
}

@media(max-width:700px){
.modalContent{
grid-template-columns:1fr;
}
}

.modalMedia img{
width:100%;
height:300px;
object-fit:cover;
}

.modalInfo{
padding:15px;
}

form input, form textarea{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #333;
background:#000;
color:white;
margin-bottom:10px;
}

</style>

</head>

<body>

<section class="section">

<h2>Finish Line Motorsports</h2>

<p>
Used Cars & Trucks  
Hot Springs Arkansas
</p>

</section>


<section class="section">

<h2>Inventory</h2>

<div id="invGrid" class="invGrid"></div>

</section>


<section class="section">

<h2>Quick Vehicle Inquiry</h2>

<div class="card">

<form id="leadForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<input type="text" id="vehicle" placeholder="Vehicle Interested In">

<textarea id="message" placeholder="Questions"></textarea>

<button class="btn">Send Inquiry</button>

</form>

</div>

</section>


<div id="modalBackdrop" class="modalBackdrop">

<div class="modal">

<div class="modalContent">

<div class="modalMedia">

<img id="mImg">

</div>

<div class="modalInfo">

<h2 id="mTitle"></h2>

<p id="mPrice"></p>

<p id="mMeta"></p>

<p id="mNotes"></p>

<br>

<a id="mText" class="btn">Text About Vehicle</a>

<br><br>

<a id="videoOpen" class="btn" target="_blank">Open Video</a>

</div>

</div>

</div>

</div>


<script>

const PHONE="15016975206"

const SHEET_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vQOqE8GSpsQgfUtVpWqMXj9a35XXBRQ0O86yMB3nm5OXizqTYN3-Wv0KTxF5nCat1ljR4HDM93sY29O/pub?output=csv"

let INVENTORY=[]


function splitList(v){
return String(v||"").split(",").map(s=>s.trim()).filter(Boolean)
}

function money(n){
return "$"+Number(n||0).toLocaleString()
}

function milesFmt(n){
return Number(n||0).toLocaleString()+" miles"
}


function normalizeDropbox(url){

let u=url

u=u.replace("www.dropbox.com","dl.dropboxusercontent.com")

u=u.replace("dl=0","raw=1")

return u
}


function parseCSV(text){

let rows=text.split("\n").map(r=>r.split(","))

let header=rows.shift().map(h=>h.trim().toLowerCase())

function idx(name){
return header.indexOf(name)
}

rows.forEach(r=>{

let obj={

title:r[idx("title")],

price:r[idx("price")],

miles:r[idx("miles")],

color:r[idx("color")],

drivetrain:r[idx("drivetrain")],

cab:r[idx("cab")],

notes:r[idx("notes")],

images:splitList(r[idx("photos")]).map(normalizeDropbox),

video:normalizeDropbox(r[idx("video")])

}

if(obj.title)INVENTORY.push(obj)

})

}


async function loadInventory(){

let res=await fetch(SHEET_CSV)

let txt=await res.text()

parseCSV(txt)

renderInventory()

}


function renderInventory(){

let grid=document.getElementById("invGrid")

grid.innerHTML=""

INVENTORY.forEach((v,i)=>{

let img=v.images[0]

let card=document.createElement("div")

card.className="invCard"

card.innerHTML=`

<img src="${img}">

<div class="invBody">

<b>${v.title}</b>

<p>${money(v.price)}</p>

</div>

`

card.onclick=()=>openVehicle(i)

grid.appendChild(card)

})

}


function openVehicle(i){

let v=INVENTORY[i]

document.getElementById("mTitle").innerText=v.title

document.getElementById("mPrice").innerText=money(v.price)

document.getElementById("mMeta").innerText=[v.color,v.cab,v.drivetrain,milesFmt(v.miles)].join(" • ")

document.getElementById("mNotes").innerText=v.notes

document.getElementById("mImg").src=v.images[0]

let sms=`Hi I'm interested in the ${v.title}`

document.getElementById("mText").href=`sms:${PHONE}?body=${encodeURIComponent(sms)}`

document.getElementById("videoOpen").href=v.video

document.getElementById("modalBackdrop").classList.add("show")

}


document.getElementById("modalBackdrop").onclick=(e)=>{

if(e.target.id==="modalBackdrop")

document.getElementById("modalBackdrop").classList.remove("show")

}


document.getElementById("leadForm").addEventListener("submit",function(e){

e.preventDefault()

const name=document.getElementById("name").value

const phone=document.getElementById("phone").value

const vehicle=document.getElementById("vehicle").value

const message=document.getElementById("message").value

const text=

`New Website Lead:

Name: ${name}

Phone: ${phone}

Vehicle: ${vehicle}

Message: ${message}`

window.location.href=`sms:${PHONE}?body=${encodeURIComponent(text)}`

})


loadInventory()

</script>

</body>
</html>
